name: Sync cask

# Тап забирает свежий релиз сам, а не получает его пушем из основного
# репозитория. Так релизной джобе — той, что и так носит ключ подписи, — не
# нужен кросс-репозиторный PAT: здесь хватает собственного GITHUB_TOKEN на
# запись в свой же репозиторий.
#
# Побочная польза: механизм самовосстанавливающийся. Пропущенный или
# доработанный релиз подхватится следующим тиком, тогда как пуш из релиза
# исправляется только повторным релизом.

on:
  schedule:
    # Каждые полчаса. Задержка каска против выхода релиза — не та величина,
    # ради которой стоит держать лишний секрет.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cask
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Update cask from the latest release
        env:
          # Публичный репозиторий — авторизация для чтения релиза не нужна.
          # Токен здесь только для push в этот же тап.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Ни API, ни токена: только стабильные ссылки на ассеты релиза.
          #
          # gh с автоматическим GITHUB_TOKEN тут не годится — он scoped на свой
          # репозиторий и релизы соседнего не видит (404), а анонимный вызов
          # api.github.com упирается в лимит по IP раннера (403). Прямая
          # загрузка ассета идёт мимо API и не лимитируется.
          curl -fsSL -o /tmp/latest.json \
            https://github.com/zdllucky/wotold/releases/latest/download/latest.json
          VERSION=$(jq -r .version /tmp/latest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::notice::Опубликованных релизов нет — нечего синхронизировать"
            exit 0
          fi

          # Раньше здесь стоял выход по «версия не изменилась». Из-за него
          # правка шаблона — например снятие депрекации в depends_on — не
          # доезжала до тапа, пока не выйдет посторонний релиз. Рендерим
          # всегда, а коммитим только если результат отличается: проверку
          # делает `git diff --cached` ниже.

          # SHA256 считаем по тому самому файлу, который получит пользователь.
          curl -fsSL -o /tmp/wotold.dmg \
            https://github.com/zdllucky/wotold/releases/latest/download/Wotold-arm64.dmg
          SHA=$(sha256sum /tmp/wotold.dmg | cut -d' ' -f1)

          # Шаблон — с main, а не с тега выпуска. Версия и контрольная сумма
          # всё равно берутся из реального релиза, а вот упаковка (депрекации
          # Homebrew, формулировки caveats) обязана чиниться сразу: привязка к
          # тегу означала бы, что предупреждение brew живёт до следующего
          # релиза, никак с ним не связанного.
          curl -fsSL -o /tmp/wotold.rb.tmpl \
            "https://raw.githubusercontent.com/zdllucky/wotold/main/.github/homebrew/wotold.rb.tmpl"

          # git пустых каталогов не хранит — на первом прогоне Casks/ ещё нет.
          mkdir -p Casks
          sed -e "s/{{VERSION}}/${VERSION}/g" -e "s/{{SHA256}}/${SHA}/g" \
            /tmp/wotold.rb.tmpl > Casks/wotold.rb

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # add ДО проверки: `git diff` не видит неотслеживаемых файлов, и на
          # первом прогоне — когда каск ещё не существует — джоба тихо решала,
          # что менять нечего, и выходила успешной. Молчаливый no-op здесь
          # худший исход: синк «работает», а каска нет.
          git add Casks/wotold.rb
          if git diff --cached --quiet; then
            echo "::notice::Изменений нет"
            exit 0
          fi

          git commit -m "wotold ${VERSION}"
          git push
